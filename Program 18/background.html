<!DOCTYPE html>
<html>
<head>
<title>Simple Background Changer</title>
</head>
<body>
<style>
body{
background-size:cover;
background-position:center;
background-repeat:no-repeat;
min-height: 100vh;
margin: 0;
}
</style>
<button onclick="changeColor()">Change Color</button>
<button onclick="changeBackgroundImage()">Change Background Image</button>
<button onclick="resetBackground()">Resume to Normal</button>
<script>
const originalColor = "white";
const originalImage = "";
function changeColor(){
document.body.style.backgroundImage ="";
document.body.style.backgroundColor ="lightpink";
}
function changeBackgroundImage()
{
document.body.style.backgroundImage="url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fDRrJTIwbW91bnRhaW58ZW58MHx8MHx8fDA%3D')";
document.body.style.backgroundColor="";
document.body.style.backgroundPosition= "center";
document.body.style.backgroundRepeat= "no-repeat";
document.body.style.backgroundSize= "cover";
}
function resetBackground(){
document.body.style.backgroundColor = originalColor;
document.body.style.backgroundImage = originalImage;
}
</script>
</body>
<html>
